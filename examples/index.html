<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0e1116" />
  <title>Conveyor Sim</title>
  <style>
    :root { --bg: #0e1116; --fg: #cdd6e0; --panel: rgba(20,26,34,.94); --line: #2a3645; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font: 13px system-ui, sans-serif; color: var(--fg); }
    #app { position: fixed; inset: 0; }

    /* botón flotante para mostrar/ocultar controles */
    #fab {
      position: fixed; top: env(safe-area-inset-top, 10px); right: 10px; z-index: 30;
      width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--panel); color: var(--fg); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #fab:active { background: #243044; }

    /* panel: hoja inferior en móvil, tarjeta lateral en escritorio */
    #panel {
      position: fixed; z-index: 20; background: var(--panel);
      border: 1px solid var(--line); display: grid; gap: 10px;
      transition: transform .22s ease, opacity .22s ease;
    }
    @media (max-width: 720px) {
      #panel {
        left: 0; right: 0; bottom: 0; border-radius: 16px 16px 0 0;
        padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0));
      }
      #panel.hidden { transform: translateY(110%); opacity: 0; pointer-events: none; }
    }
    @media (min-width: 721px) {
      #panel { top: 64px; right: 10px; width: 250px; border-radius: 12px; padding: 14px; }
      #panel.hidden { transform: translateX(120%); opacity: 0; pointer-events: none; }
    }

    #panel h1 { font-size: 14px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
    #panel label { display: grid; gap: 4px; font-size: 12px; color: #aeb9c6; }
    #panel select, #panel input[type=range] { width: 100%; }
    #panel select {
      background: #121821; color: var(--fg); border: 1px solid var(--line);
      border-radius: 8px; padding: 9px; font-size: 13px;
    }
    input[type=range] { height: 28px; }
    .row { display: flex; gap: 8px; }
    .row button {
      flex: 1; background: #1b2330; color: var(--fg); border: 1px solid var(--line);
      border-radius: 8px; padding: 11px 6px; cursor: pointer; font: 12px monospace;
    }
    .row button:active { background: #243044; }
    /* HUD compacto en móvil */
    @media (max-width: 720px) { #app :is(div) { font-size: 11px !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <button id="fab" title="Mostrar / ocultar controles">⚙</button>

  <div id="panel">
    <h1>Conveyor Sim <span id="closeP" style="cursor:pointer;opacity:.7">✕</span></h1>
    <label>Layout
      <select id="layout">
        <option value="sorter">Sorter 4500 (Virtual Pocket)</option>
        <option value="comb">Peine AC301</option>
      </select>
    </label>
    <label>Receta del Virtual Pocket
      <select id="recipe">
        <option value="chain">Cadena · 3 por color, en ciclo</option>
        <option value="together">Todo junto · lote de 12</option>
        <option value="fifo">FIFO · sin receta</option>
      </select>
    </label>
    <label>Velocidad ×<b id="speedV">1.0</b>
      <input id="speed" type="range" min="0.2" max="3" value="1" step="0.1" />
    </label>
    <label>Carga ×<b id="rateV">1.0</b>
      <input id="rate" type="range" min="0.3" max="2" value="1" step="0.1" />
    </label>
    <label id="lanesWrap" style="display:none">Carriles (peine): <b id="lanesV">7</b>
      <input id="lanes" type="range" min="1" max="12" value="7" step="1" />
    </label>
    <div class="row">
      <button data-view="iso">ISO</button>
      <button data-view="top">TOP</button>
      <button data-view="front">FRONT</button>
    </div>
    <div class="row">
      <button id="toggle">Pausa</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <!-- Three.js desde CDN: no requiere npm install -->
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js" } }
  </script>
  <script type="module">
    import { ConveyorSim } from '../src/engine.js';
    import { mountSim } from '../src/render.js';
    import { buildComb, buildSorter4500 } from '../src/layouts.js';

    const app = document.getElementById('app');
    let sim, api, running = true;
    let lanes = 7, speedMul = 1, rateMul = 1, layout = 'sorter', recipe = 'chain';
    const SORT_COLORS = ['red', 'blue', 'green', 'yellow', 'orange', 'purple'];

    function recipeSpec() {
      if (recipe === 'together') return { loop: true, steps: [{ color: SORT_COLORS, qty: 12 }] };
      if (recipe === 'fifo') return { loop: true, steps: [] };
      return { loop: true, steps: SORT_COLORS.map(c => ({ color: c, qty: 3 })) };
    }
    function build() {
      if (api) api.stop();
      app.innerHTML = '';
      document.getElementById('lanesWrap').style.display = layout === 'comb' ? 'grid' : 'none';
      const model = layout === 'sorter'
        ? buildSorter4500({ rate: 3600 * rateMul, pocket: recipeSpec() })
        : buildComb({ lanes, rate: 600 * lanes * rateMul });
      sim = new ConveyorSim(model, { seed: 1 });
      api = mountSim(sim, { container: app, warmup: 8 });
      api.setSpeed(speedMul).view('top').start();
      running = true;
      document.getElementById('toggle').textContent = 'Pausa';
    }

    const $ = id => document.getElementById(id);
    const onInput = (id, fn) => $(id).addEventListener('input', fn);
    const onChange = (id, fn) => $(id).addEventListener('change', fn);
    onChange('layout', e => { layout = e.target.value; build(); });
    onChange('recipe', e => { recipe = e.target.value; build(); });
    onInput('lanes', e => { lanes = +e.target.value; $('lanesV').textContent = lanes; build(); });
    onInput('speed', e => { speedMul = +e.target.value; $('speedV').textContent = speedMul.toFixed(1); api.setSpeed(speedMul); });
    onInput('rate', e => { rateMul = +e.target.value; $('rateV').textContent = rateMul.toFixed(1); build(); });
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => api.view(b.dataset.view)));
    $('toggle').addEventListener('click', () => {
      running = !running; running ? api.start() : api.stop();
      $('toggle').textContent = running ? 'Pausa' : 'Reanudar';
    });
    $('reset').addEventListener('click', build);

    // mostrar / ocultar controles
    const panel = $('panel');
    $('fab').addEventListener('click', () => panel.classList.toggle('hidden'));
    $('closeP').addEventListener('click', () => panel.classList.add('hidden'));

    build();
  </script>
</body>
</html>
