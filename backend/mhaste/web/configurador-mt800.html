<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MT800-Pro · Configurador</title>
<style>
  :root{--bg:#0d1015;--panel:rgba(18,22,29,.86);--line:rgba(255,255,255,.08);
    --ink:#e7ebf0;--dim:#8b95a3;--accent:#39d0c8;--accent2:#e8b24a;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--ink)}
  #render{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .title{top:14px;left:16px;right:360px}
  .title .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .title h1{margin:2px 0 0;font-size:14px;font-weight:600}
  .title h1 b{color:var(--accent)}
  .code{margin-top:7px;display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent2);
    background:rgba(232,178,74,.1);border:1px solid rgba(232,178,74,.25);padding:4px 9px;border-radius:6px;word-break:break-all}
  .stats{margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.6}
  .stats b{color:#c6cdd6}

  .params{position:fixed;left:16px;bottom:14px;width:262px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;z-index:6;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
    padding:13px 14px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100vh - 150px);overflow-y:auto}
  .params h2{margin:0 0 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .fld{margin-bottom:11px}
  .fld label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .fld label .v{color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:rgba(255,255,255,.13);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px rgba(57,208,200,.16)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  .seg{display:flex;gap:5px}
  .seg button{flex:1;font-family:var(--mono);font-size:10.5px;padding:6px 0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);border-radius:7px;cursor:pointer;transition:.15s}
  .seg button.on{background:rgba(57,208,200,.16);border-color:rgba(57,208,200,.5);color:var(--accent)}
  .sw{display:flex;gap:6px}
  .sw button{flex:1;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer}
  .sw button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tg{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;color:#c6cdd6;margin-bottom:9px}
  .toggle{position:relative;width:36px;height:20px;border-radius:20px;background:rgba(255,255,255,.12);cursor:pointer;transition:.18s;flex:none}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:"";position:absolute;top:2.5px;left:2.5px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.18s}
  .toggle.on::after{transform:translateX(16px)}

  .bom{position:fixed;top:14px;right:14px;width:338px;max-height:calc(100vh - 28px);background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:6;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
  .bom .head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .bom .head h2{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .bom .head .tot{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .bom .body{overflow-y:auto;padding:5px 0}
  .cat{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:8px 15px 3px}
  .brow{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:4px 15px;border-bottom:1px solid rgba(255,255,255,.04)}
  .brow .c{font-family:var(--mono);font-size:9.5px;color:#c6cdd6}
  .brow .d{font-size:10.5px;color:var(--ink);grid-column:1}
  .brow .q{font-family:var(--mono);font-size:10.5px;color:var(--accent2);text-align:right;grid-row:1/3;align-self:center}

  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0d1015;z-index:40;padding:28px;text-align:center}
  #err h2{margin:0;color:#ff7a7a;font-family:var(--mono);font-size:13px}
  #err pre{max-width:90%;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:13px}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--bg);z-index:20;transition:opacity .5s}
  #loader.hidden{opacity:0;pointer-events:none}
  .spin{width:32px;height:32px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  #loader p{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:820px){
    .title{right:16px;top:8px;left:12px}
    .bom{right:10px;left:10px;width:auto;top:auto;bottom:10px;max-height:34vh}
    .params{left:10px;right:10px;width:auto;bottom:calc(34vh + 18px);max-height:40vh}
  }
</style></head>
<body>
  <canvas id="render"></canvas>
  <div class="hud title">
    <div class="k">M-haste · Configurador en vivo</div>
    <h1>MT800-<b>Pro</b> · Banda estrecha</h1>
    <div class="code" id="code">—</div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="params">
    <h2>Parámetros</h2>
    <div class="fld"><label>Largo L <span class="v" id="vL">1400</span></label><input type="range" id="L" min="400" max="6000" step="50" value="1400"></div>
    <div class="fld"><label>Ancho W <span class="v" id="vW">600</span></label><input type="range" id="W" min="80" max="1500" step="20" value="600"></div>
    <div class="row2">
      <div class="fld"><label>Banda T <span class="v" id="vT">25</span></label><input type="range" id="T" min="15" max="80" step="5" value="25"></div>
      <div class="fld"><label>Paso <span class="v" id="vP">85</span></label><input type="range" id="P" min="30" max="200" step="5" value="85"></div>
    </div>
    <div class="fld"><label>Polea Ø <span class="v" id="vD">34</span></label><input type="range" id="D" min="20" max="80" step="2" value="34"></div>
    <div class="fld"><label>Soporte (UGN)</label><div class="seg" id="ugn"><button data-v="legs" class="on">Patas</button><button data-v="low">Bajo</button></div></div>
    <div class="fld" id="legrow"><label>Altura patas <span class="v" id="vH">700</span></label><input type="range" id="H" min="300" max="1200" step="10" value="700"></div>
    <div class="fld"><label>Motriz (DM)</label><div class="seg" id="dm"><button data-v="left" class="on">Izq</button><button data-v="right">Der</button></div></div>
    <div class="tg">Guías laterales (LA) <div class="toggle on" id="la"></div></div>
    <div class="tg">Ruedas <div class="toggle on" id="cw"></div></div>
    <div class="fld"><label>Banda</label><div class="sw" id="col">
      <button data-c="#171717" style="background:#171717" class="on"></button>
      <button data-c="#1f5e5a" style="background:#2aa39a"></button>
      <button data-c="#1b3a6b" style="background:#2f6cff"></button>
      <button data-c="#5a4a1f" style="background:#caa23a"></button></div></div>
    <div class="tg" style="margin-top:4px">Movimiento <div class="toggle on" id="anim"></div></div>
  </div>

  <div class="bom">
    <div class="head"><h2>Despiece · BOM</h2><span class="tot" id="tot"></span></div>
    <div class="body" id="bbody"></div>
  </div>

  <div id="loader"><div class="spin"></div><p>Iniciando configurador</p></div>
  <div id="err"><h2>Error</h2><pre></pre></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/8.20.0/babylon.js" crossorigin="anonymous"></script>
<script>
(function(){
  function showErr(m){var d=document.getElementById('err');if(!d)return;d.style.display='flex';d.querySelector('pre').textContent=m;
    var l=document.getElementById('loader');if(l)l.classList.add('hidden');}
  window.addEventListener('error',function(e){showErr((e.message||'Error')+(e.filename?('\n@ '+e.filename+':'+e.lineno):''));});
  if(typeof BABYLON==='undefined'){showErr('Babylon.js no cargo desde el CDN.');return;}

  try{
  var V3=BABYLON.Vector3,C3=BABYLON.Color3,MB=BABYLON.MeshBuilder,Mesh=BABYLON.Mesh;
  var canvas=document.getElementById('render');
  var engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,antialias:true},true);
  var scene=new BABYLON.Scene(engine);
  scene.clearColor=new BABYLON.Color4(0.80,0.84,0.875,1);
  var camera=new BABYLON.ArcRotateCamera('c',-Math.PI/2.5,1.05,18,V3.Zero(),scene);
  camera.attachControl(canvas,true);
  camera.lowerRadiusLimit=3;camera.upperRadiusLimit=120;camera.lowerBetaLimit=0.12;camera.upperBetaLimit=Math.PI/2-0.03;
  camera.wheelDeltaPercentage=0.012;camera.pinchDeltaPercentage=0.012;camera.panningSensibility=0;camera.minZ=0.05;camera.maxZ=2000;

  try{var it=new BABYLON.DynamicTexture('ibl',{width:256,height:256},scene,true),ic=it.getContext();
    var ig=ic.createLinearGradient(0,0,0,256);ig.addColorStop(0,'#eef3f7');ig.addColorStop(0.45,'#ccd6de');ig.addColorStop(0.52,'#aab4bd');ig.addColorStop(1,'#7c848c');
    ic.fillStyle=ig;ic.fillRect(0,0,256,256);ic.fillStyle='rgba(255,255,255,0.5)';ic.beginPath();ic.ellipse(80,70,55,30,0,0,7);ic.fill();
    it.update();it.coordinatesMode=BABYLON.Texture.SPHERICAL_MODE;it.gammaSpace=false;scene.environmentTexture=it;scene.environmentIntensity=0.9;}catch(e){}
  try{var sky=MB.CreateSphere('sky',{diameter:1400,sideOrientation:Mesh.BACKSIDE,segments:16},scene);
    var sm=new BABYLON.StandardMaterial('sk',scene);var gt=new BABYLON.DynamicTexture('gt',{width:8,height:256},scene,true),gc=gt.getContext();
    var gg=gc.createLinearGradient(0,0,0,256);gg.addColorStop(0,'#cdd9e3');gg.addColorStop(0.5,'#e9eef2');gg.addColorStop(1,'#b7c0c8');
    gc.fillStyle=gg;gc.fillRect(0,0,8,256);gt.update();sm.emissiveTexture=gt;sm.disableLighting=true;sm.backFaceCulling=false;sky.material=sm;sky.infiniteDistance=true;sky.isPickable=false;}catch(e){}
  var hemi=new BABYLON.HemisphericLight('h',new V3(0.1,1,0.15),scene);hemi.intensity=0.55;hemi.groundColor=new C3(0.45,0.48,0.53);
  var key=new BABYLON.DirectionalLight('k',new V3(-0.55,-1,-0.42),scene);key.position=new V3(9,22,7);key.intensity=2.0;
  var rim=new BABYLON.DirectionalLight('r',new V3(0.6,-0.45,0.7),scene);rim.intensity=0.7;
  var fill=new BABYLON.DirectionalLight('f',new V3(0.2,-0.3,-1.0),scene);fill.intensity=0.55;
  var shadow=null;try{shadow=new BABYLON.ShadowGenerator(1024,key);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=22;shadow.darkness=0.55;shadow.bias=0.001;}catch(e){}
  var ground=MB.CreateGround('g',{width:600,height:600},scene);
  var gm=new BABYLON.PBRMetallicRoughnessMaterial('gm',scene);gm.baseColor=new C3(0.86,0.885,0.905);gm.metallic=0;gm.roughness=0.85;ground.material=gm;ground.receiveShadows=true;
  try{var dp=new BABYLON.DefaultRenderingPipeline('dp',true,scene,[camera]);dp.fxaaEnabled=true;dp.samples=4;dp.imageProcessingEnabled=true;
    dp.imageProcessing.toneMappingEnabled=true;dp.imageProcessing.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;dp.imageProcessing.exposure=1.05;dp.imageProcessing.contrast=1.12;}catch(e){}

  function pbr(rgb,met,rou){var m=new BABYLON.PBRMetallicRoughnessMaterial('m',scene);m.baseColor=new C3(rgb[0],rgb[1],rgb[2]);m.metallic=met;m.roughness=rou;return m;}
  var MAT={
    belt_profile:pbr([0.78,0.79,0.81],0.82,0.50), rail:pbr([0.63,0.65,0.68],0.78,0.52),
    head:pbr([0.87,0.88,0.90],0.9,0.34), pulley:pbr([0.72,0.74,0.77],0.95,0.26),
    bearing:pbr([0.50,0.52,0.56],0.95,0.30), shaft:pbr([0.69,0.71,0.74],0.95,0.24),
    motor:pbr([0.27,0.28,0.31],0.55,0.48), motorplate:pbr([0.81,0.82,0.84],0.85,0.35),
    foot:pbr([0.34,0.35,0.38],0.7,0.5), wheel:pbr([0.12,0.12,0.13],0.1,0.6), guide:pbr([0.63,0.65,0.68],0.78,0.5)
  };
  var plateTex=new BABYLON.DynamicTexture('pt',{width:256,height:256},scene,true);
  (function(){var c=plateTex.getContext();c.fillStyle='#dde0e4';c.fillRect(0,0,256,256);
    c.fillStyle='rgba(60,66,74,0.8)';for(var y=34;y<256;y+=46)for(var x=34;x<256;x+=46){c.beginPath();c.arc(x,y,6,0,7);c.fill();}
    c.strokeStyle='rgba(120,126,134,0.5)';c.lineWidth=3;c.strokeRect(2,2,252,252);plateTex.update();})();
  var matHead=MAT.head; matHead.baseTexture=plateTex;
  var beltTex=new BABYLON.DynamicTexture('bt',{width:256,height:48},scene,false);
  function drawBelt(hex){var c=beltTex.getContext();c.fillStyle=hex;c.fillRect(0,0,256,48);
    c.strokeStyle='rgba(255,255,255,0.05)';c.lineWidth=2;var x;for(x=0;x<256;x+=64){c.beginPath();c.moveTo(x,0);c.lineTo(x,48);c.stroke();}
    c.strokeStyle='rgba(0,0,0,0.22)';c.lineWidth=1;for(x=32;x<256;x+=64){c.beginPath();c.moveTo(x,0);c.lineTo(x,48);c.stroke();}beltTex.update();}
  beltTex.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE;beltTex.uScale=10;
  var matBelt=new BABYLON.PBRMetallicRoughnessMaterial('mb',scene);matBelt.baseTexture=beltTex;matBelt.metallic=0;matBelt.roughness=0.66;

  var C={length:1400,width:600,belt_width:25,belt_pitch:85,pulley_d:34,understructure:'legs',leg_height:700,drive_end:'left',side_guides:true,casters:true,belt_color:'#171717',anim:true};
  var S=0.01, holder=null, belts=[], pulleys=[], framed=false;

  function racetrack(L,rad,seg){var p=[],hx=L/2,i,a;
    for(i=0;i<=seg;i++)p.push([-hx+(i/seg)*L,rad]);
    for(i=1;i<seg;i++){a=Math.PI/2-(i/seg)*Math.PI;p.push([hx+rad*Math.cos(a),rad*Math.sin(a)]);}
    for(i=0;i<=seg;i++)p.push([hx-(i/seg)*L,-rad]);
    for(i=1;i<seg;i++){a=-Math.PI/2-(i/seg)*Math.PI;p.push([-hx+rad*Math.cos(a),rad*Math.sin(a)]);}
    return p;}
  function box(w,h,d,x,y,z,mat){var b=MB.CreateBox('b',{width:w,height:h,depth:d},scene);b.position.set(x,y,z);b.material=mat;b.parent=holder;if(shadow)shadow.addShadowCaster(b);return b;}
  function cyl(dia,h,x,y,z,mat,rotAxis){var c=MB.CreateCylinder('c',{diameter:dia,height:h,tessellation:20},scene);
    if(rotAxis==='Z')c.rotation.x=Math.PI/2;else if(rotAxis==='X')c.rotation.z=Math.PI/2;
    c.position.set(x,y,z);c.material=mat;c.parent=holder;if(shadow)shadow.addShadowCaster(c);return c;}

  function buildModel(){
    if(holder)holder.dispose(false,true);
    holder=new BABYLON.TransformNode('H',scene);holder.scaling.setAll(S);belts=[];pulleys=[];
    var n=Math.max(1,Math.round(C.width/C.belt_pitch));
    var pitch=C.width/n,R=C.pulley_d/2,L=C.length,bw=C.belt_width,rb=R+3,profH=80,rail=40;
    var span=L-2*(R+14);
    var casterH=(C.understructure==='legs'&&C.casters)?60:0;
    var railY=(C.understructure==='legs')?(casterH+C.leg_height):70;
    var beltY=railY+rail/2+profH/2+R+6;
    var driveSign=(C.drive_end==='left')?-1:1;
    var laneZ=[],i;for(i=0;i<n;i++)laneZ.push(-C.width/2+pitch/2+i*pitch);
    var seg=18;
    for(var li=0;li<n;li++){
      var z=laneZ[li];
      box(L,profH,Math.min(bw,profH),0,beltY-R-profH/2,z,MAT.belt_profile);
      var pts=racetrack(span,rb,seg);
      var pl=pts.map(function(p){return new V3(p[0],beltY+p[1],z-bw/2);});
      var pr=pts.map(function(p){return new V3(p[0],beltY+p[1],z+bw/2);});
      var belt=MB.CreateRibbon('belt',{pathArray:[pl,pr],closePath:true,sideOrientation:Mesh.DOUBLESIDE},scene);
      belt.material=matBelt;belt.parent=holder;if(shadow)shadow.addShadowCaster(belt);belts.push(belt);
      for(var s=-1;s<=1;s+=2){
        var spin=new BABYLON.TransformNode('sp',scene);spin.parent=holder;spin.position.set(s*span/2,beltY,z);
        var roll=MB.CreateCylinder('p',{diameter:R*2,height:bw,tessellation:20},scene);roll.rotation.x=Math.PI/2;roll.material=MAT.pulley;roll.parent=spin;if(shadow)shadow.addShadowCaster(roll);
        for(var e=-1;e<=1;e+=2){var brg=MB.CreateCylinder('e',{diameter:R*1.25,height:3,tessellation:18},scene);brg.rotation.x=Math.PI/2;brg.position.z=e*(bw/2-1.5);brg.material=MAT.bearing;brg.parent=spin;}
        pulleys.push(spin);
        for(var sp2=-1;sp2<=1;sp2+=2){box(150,R*2+12,8,s*(span/2-60),beltY,z+sp2*(bw/2+6),matHead);}
      }
    }
    cyl(12,C.width+40,driveSign*span/2,beltY,0,MAT.shaft,'Z');
    var mz=-C.width/2-60;
    box(160,72,96,driveSign*span/2,beltY,mz,MAT.motorplate);
    cyl(72,150,driveSign*span/2+6,beltY,mz-90,MAT.motor,'Z');
    box(8,95,95,driveSign*span/2-84,beltY,mz+58,MAT.motorplate);
    var zExt=C.width/2+rail/2+6;
    box(L,rail,rail,0,railY,-zExt,MAT.rail);box(L,rail,rail,0,railY,zExt,MAT.rail);
    [-span/2+R,0,span/2-R].forEach(function(xc){box(rail,rail,2*zExt,xc,railY-rail,0,MAT.rail);});
    if(C.side_guides){[laneZ[0]-pitch/2,laneZ[n-1]+pitch/2].forEach(function(zz){box(L,26,6,0,beltY+R+8,zz,MAT.guide);});}
    if(C.understructure==='legs'){
      [-span/2+R,span/2-R].forEach(function(xc){[-zExt,zExt].forEach(function(zz){
        box(rail,C.leg_height,rail,xc,casterH+C.leg_height/2,zz,MAT.rail);
        if(C.casters){cyl(60,18,xc,30,zz,MAT.wheel,'X');box(14,30,34,xc,42,zz,MAT.foot);}
        else{cyl(56,10,xc,5,zz,MAT.foot);cyl(14,40,xc,25,zz,MAT.foot);}
      });});
    }
    holder.computeWorldMatrix(true);
    var bb=holder.getHierarchyBoundingVectors(true),ctr=bb.min.add(bb.max).scale(0.5);
    holder.position.x-=ctr.x;holder.position.z-=ctr.z;holder.position.y-=bb.min.y;
    holder.computeWorldMatrix(true);
    var b2=holder.getHierarchyBoundingVectors(true),c2=b2.min.add(b2.max).scale(0.5),sz=b2.max.subtract(b2.min).length();
    camera.setTarget(c2);if(!framed){camera.radius=sz*0.92;framed=true;}
  }

  function computeBOM(){
    var n=Math.max(1,Math.round(C.width/C.belt_pitch));
    var Ln=Math.round(C.length),W=Math.round(C.width),bw=Math.round(C.belt_width),pd=Math.round(C.pulley_d);
    var span=Math.round(Ln-2*(C.pulley_d/2+14)),belt_len=Math.round(2*span+3.1416*(pd+6));
    var legs=C.understructure==='legs',rows=[],pos=0;
    function add(cat,code,desc,qty,dim){if(qty>0)rows.push({pos:++pos,category:cat,code:code,desc:desc,qty:qty,dim:dim});}
    add('Perfil','MT800-PF-40-L'+Ln,'Riel de chasis (T-slot 40)',2,'40x40x'+Ln);
    add('Perfil','MT800-PF-40-W'+W,'Travesano de chasis',3,'40x40x'+(W+92));
    add('Perfil','MT800-05-301-W'+bw+'-L'+Ln,'Perfil de banda (guia)',n,(bw+5)+'x80x'+Ln);
    if(legs)add('Perfil','MTB800-302','Pata de soporte (UGN)',4,'40x40x'+Math.round(C.leg_height));
    add('Cabezal','MTB800-207','Placa de cabezal motriz',2,'250x220x6');
    add('Cabezal','MTB800-207-I','Placa de cabezal idler (tensor)',2,'250x220x6');
    add('Conector','MTB800-331','Conector de esquina',legs?4:0,'48x48x36');
    add('Conector','MTB800-301','Soporte de travesano',6,'64x28x28');
    add('Conector','MT800-217','Tope de banda',2*n,'45x15x15');
    add('Transmision','MT800-PUL-D'+pd,'Polea motriz',n,'D'+pd+'x'+bw);
    add('Transmision','MT800-PUL-D'+pd+'-I','Polea idler',n,'D'+pd+'x'+bw);
    add('Transmision','MT800-BRG-625','Rodamiento',4*n,'D16x5');
    add('Transmision','MT800-SH-12','Eje motriz',1,'D12x'+(W+40));
    add('Banda','MT800-BELT-PVC-W'+bw,'Banda PVC '+bw+' mm',n,bw+'x'+belt_len+' (perim.)');
    add('Accionamiento','MT800-GM-160x72','Motorreductor',1,'160x72');
    add('Accionamiento','MTB800-207-M','Placa de motor',1,'95x95x8');
    add('Accionamiento','DM1-M10-M2','Control board digital M10/M2',1,'-');
    if(legs&&C.casters)add('Soporte','MT800-CW-60','Rueda con freno',4,'D60');
    else if(legs)add('Soporte','MT800-FT-M12','Pie nivelador M12',4,'D56');
    if(C.side_guides)add('Soporte','MT800-LA2-L'+Ln,'Guia lateral (LA)',2,'6x26x'+Ln);
    add('Tornilleria','DIN912-M5x12','Tornillo Allen M5',12*n+24,'M5x12');
    add('Tornilleria','MT800-TN-M5','Tuerca en T M5',12*n+24,'M5');
    return rows;
  }
  function code(){var s=C.understructure==='legs'?'S2':'S0',la=C.side_guides?'LA2':'LA0',ugn=C.understructure==='legs'?'UGN2':'UGN0',dm=C.drive_end==='left'?'DM1':'DM2';
    return 'MT800-Pro-FL-A-L'+Math.round(C.length)+'-W'+Math.round(C.width)+'-'+Math.round(C.belt_width)+'TU1-'+s+'-'+la+'-'+ugn+'-'+dm;}

  function renderBOM(){
    var rows=computeBOM(),tot=rows.reduce(function(a,r){return a+r.qty;},0);
    document.getElementById('tot').textContent=tot+' piezas';
    var body=document.getElementById('bbody');body.innerHTML='';
    var cats={},order=[];rows.forEach(function(r){if(!cats[r.category]){cats[r.category]=[];order.push(r.category);}cats[r.category].push(r);});
    order.forEach(function(cat){var h=document.createElement('div');h.className='cat';h.textContent=cat;body.appendChild(h);
      cats[cat].forEach(function(r){var d=document.createElement('div');d.className='brow';
        d.innerHTML='<div class="c">'+r.code+'</div><div class="q">x'+r.qty+'</div><div class="d">'+r.desc+'</div>';body.appendChild(d);});});
  }
  function renderInfo(){
    document.getElementById('code').textContent=code();
    var n=Math.max(1,Math.round(C.width/C.belt_pitch)),base=C.understructure==='legs'?C.leg_height:60;
    var env=[Math.round(C.length),Math.round(C.width+52),Math.round(base+80+C.pulley_d+8)];
    document.getElementById('stats').innerHTML='bandas <b>'+n+'</b> &nbsp; paso <b>'+(C.width/n).toFixed(0)+'</b> mm &nbsp; envelope <b>'+env.join(' x ')+'</b> mm';
  }
  var rebuildTimer=null;
  function update(rebuild){if(rebuild){if(rebuildTimer)clearTimeout(rebuildTimer);rebuildTimer=setTimeout(buildModel,40);}renderBOM();renderInfo();}

  var pd=false;canvas.addEventListener('pointerdown',function(){pd=true;});window.addEventListener('pointerup',function(){pd=false;});
  scene.onBeforeRenderObservable.add(function(){
    var dt=Math.min(engine.getDeltaTime()/1000,0.05);
    if(C.anim){var v=180,span=C.length-2*(C.pulley_d/2+14),loop=2*span+Math.PI*2*(C.pulley_d/2+3);
      beltTex.uOffset-=(v/loop)*dt;var om=v/(C.pulley_d/2),i;for(i=0;i<pulleys.length;i++)pulleys[i].rotation.z-=om*dt;}
    if(!pd)camera.alpha+=0.0012;
  });

  function slider(id,key,vid,unit){var el=document.getElementById(id);el.addEventListener('input',function(){
    C[key]=parseFloat(el.value);document.getElementById(vid).textContent=el.value+(unit||'');update(true);});}
  slider('L','length','vL');slider('W','width','vW');slider('T','belt_width','vT');slider('P','belt_pitch','vP');slider('D','pulley_d','vD');slider('H','leg_height','vH');
  function seg(id,key,cb){document.querySelectorAll('#'+id+' button').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('#'+id+' button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');C[key]=b.dataset.v;if(cb)cb();update(true);});});}
  seg('ugn','understructure',function(){document.getElementById('legrow').style.display=C.understructure==='legs'?'block':'none';});
  seg('dm','drive_end');
  function toggle(id,key,rebuild){var el=document.getElementById(id);el.addEventListener('click',function(){el.classList.toggle('on');C[key]=el.classList.contains('on');update(rebuild);});}
  toggle('la','side_guides',true);toggle('cw','casters',true);toggle('anim','anim',false);
  document.querySelectorAll('#col button').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('#col button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');C.belt_color=b.dataset.c;drawBelt(C.belt_color);});});

  drawBelt(C.belt_color);buildModel();update(false);
  document.getElementById('loader').classList.add('hidden');
  engine.runRenderLoop(function(){scene.render();});window.addEventListener('resize',function(){engine.resize();});
  }catch(err){showErr((err&&err.stack)?err.stack:String(err));}
})();
</script>
</body></html>
