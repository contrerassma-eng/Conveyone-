<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Conveyone · Simulador de catálogo</title>
<style>
  :root{--bg:#0d1015;--panel:rgba(18,22,29,.86);--line:rgba(255,255,255,.08);
    --ink:#e7ebf0;--dim:#8b95a3;--accent:#39d0c8;--accent2:#e8b24a;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--ink)}
  #render{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .title{top:14px;left:16px;right:360px}
  .title .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .title h1{margin:2px 0 0;font-size:14px;font-weight:600}.title h1 b{color:var(--accent)}
  .code{margin-top:7px;display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent2);
    background:rgba(232,178,74,.1);border:1px solid rgba(232,178,74,.25);padding:4px 9px;border-radius:6px;word-break:break-all}
  .stats{margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.6}.stats b{color:#c6cdd6}
  .params{position:fixed;left:16px;bottom:14px;width:268px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;z-index:6;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
    padding:13px 14px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100vh - 150px);overflow-y:auto}
  .params h2{margin:0 0 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .fld{margin-bottom:11px}
  .fld label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .fld label .v{color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:rgba(255,255,255,.13);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px rgba(57,208,200,.16)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  .seg{display:flex;gap:5px;flex-wrap:wrap}
  .seg button{flex:1;min-width:34px;font-family:var(--mono);font-size:10.5px;padding:6px 0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);border-radius:7px;cursor:pointer}
  .seg button.on{background:rgba(57,208,200,.16);border-color:rgba(57,208,200,.5);color:var(--accent)}
  .sw{display:flex;gap:6px}
  .sw button{flex:1;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer}
  .sw button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
  .tg{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;color:#c6cdd6;margin-bottom:9px}
  .toggle{position:relative;width:36px;height:20px;border-radius:20px;background:rgba(255,255,255,.12);cursor:pointer;transition:.18s;flex:none}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:"";position:absolute;top:2.5px;left:2.5px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.18s}
  .toggle.on::after{transform:translateX(16px)}
  .btn{width:100%;padding:9px 0;border-radius:8px;border:1px solid rgba(57,208,200,.5);background:rgba(57,208,200,.16);color:var(--accent);font-family:var(--mono);font-size:11px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{margin-top:7px;color:var(--dim);font-family:var(--mono);font-size:9.5px;line-height:1.55;word-break:break-all}
  .bom{position:fixed;top:14px;right:14px;width:338px;max-height:calc(100vh - 28px);background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:6;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
  .bom .head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .bom .head h2{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .bom .head .tot{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .bom .body{overflow-y:auto;padding:5px 0}
  .cat{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:8px 15px 3px}
  .brow{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:4px 15px;border-bottom:1px solid rgba(255,255,255,.04)}
  .brow .c{font-family:var(--mono);font-size:9.5px;color:#c6cdd6}
  .brow .c .src{color:var(--dim)}
  .brow .d{font-size:10.5px;color:var(--ink);grid-column:1}
  .brow .q{font-family:var(--mono);font-size:10.5px;color:var(--accent2);text-align:right;grid-row:1/3;align-self:center}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0d1015;z-index:40;padding:28px;text-align:center}
  #err h2{margin:0;color:#ff7a7a;font-family:var(--mono);font-size:13px}
  #err pre{max-width:90%;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:13px}
  .vista{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .ghost{width:100%;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-family:var(--mono);font-size:10.5px;cursor:pointer;margin-top:4px}
  #uitoggle{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;
    padding:9px 16px;border-radius:22px;border:1px solid rgba(57,208,200,.5);background:var(--panel);color:var(--accent);
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;cursor:pointer;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  body.clean .params,body.clean .bom,body.clean .title,body.clean .hint{display:none!important}
  @media (max-width:820px){.title{right:16px;left:12px}.bom{right:10px;left:10px;width:auto;top:auto;bottom:10px;max-height:34vh}.params{left:10px;right:10px;width:auto;bottom:calc(34vh + 18px);max-height:42vh}
    #uitoggle{left:auto;right:10px;bottom:auto;top:60px;transform:none}}
</style></head>
<body>
  <canvas id="render"></canvas>
  <div class="hud title">
    <div class="k">Conveyone · Simulador de catálogo</div>
    <h1 id="mname">—</h1>
    <div class="code" id="code">—</div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="params"><h2>Parámetros</h2>
    <div class="fld"><label>Modelo</label><div class="seg" id="modelsel"></div></div>
    <div id="fields"></div>
    <div class="vista">
      <div class="tg">Ver tornillería <div class="toggle" id="v_bolts"></div></div>
      <div class="tg">Auto-rotación <div class="toggle on" id="v_rot"></div></div>
      <div class="tg">Animación <div class="toggle on" id="v_anim"></div></div>
    </div>
    <button class="btn" id="export" style="margin-top:8px">Exportar STEP (B-Rep real)</button>
    <div class="msg" id="exportmsg"></div>
  </div>
  <div class="bom"><div class="head"><h2>Despiece · BOM</h2><span class="tot" id="tot"></span></div><div class="body" id="bbody"></div></div>
  <button id="uitoggle" title="Ocultar/mostrar controles (H)">Ocultar panel</button>
  <div id="err"><h2>Error</h2><pre></pre></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/8.20.0/babylon.js" crossorigin="anonymous"></script>
<script type="module">
  import { configure, getModel, listModels } from './src/engine/index.js';
  import { createView } from './src/render/babylonView.js';

  function showErr(m){ const d=document.getElementById('err'); d.style.display='flex'; d.querySelector('pre').textContent=m; }
  window.addEventListener('error', (e)=>showErr((e.message||'Error')+(e.filename?('\n@ '+e.filename+':'+e.lineno):'')));
  if(typeof BABYLON==='undefined'){ showErr('Babylon.js no cargó desde el CDN.'); }

  try{
    const view=createView(document.getElementById('render'), {});
    const API=(new URLSearchParams(location.search).get('api')||window.CONVEYONE_API||'').replace(/\/$/,'');
    let model=null, params=null, last=null, timer=null;

    // --- selector de modelo ---
    const msel=document.getElementById('modelsel');
    msel.innerHTML=listModels().map((m,i)=>`<button data-id="${m.id}"${i===0?' class="on"':''}>${m.id.toUpperCase().replace('_PRO','')}</button>`).join('');
    msel.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      msel.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      loadModel(b.dataset.id);
    }));

    function buildFields(){
      const host=document.getElementById('fields'); host.innerHTML='';
      for(const f of model.schema.params){
        const wrap=document.createElement('div'); wrap.className='fld';
        if(f.type==='float'||f.type==='int'){
          wrap.innerHTML=`<label>${f.label} <span class="v">${params[f.key]}</span></label>
            <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${params[f.key]}">`;
          host.appendChild(wrap);
          const inp=wrap.querySelector('input'), val=wrap.querySelector('.v');
          inp.addEventListener('input',()=>{ params[f.key]=parseFloat(inp.value); val.textContent=inp.value; update(true); });
        } else if(f.type==='enum'){
          wrap.innerHTML=`<label>${f.label}</label><div class="seg">`+
            f.options.map(o=>`<button data-v="${o}"${String(o)===String(params[f.key])?' class="on"':''}>${o}</button>`).join('')+`</div>`;
          host.appendChild(wrap);
          wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
            wrap.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
            params[f.key]=b.dataset.v; update(true);
          }));
        } else if(f.type==='bool'){
          wrap.className='tg'; wrap.innerHTML=`${f.label} <div class="toggle${params[f.key]?' on':''}"></div>`;
          host.appendChild(wrap);
          const t=wrap.querySelector('.toggle');
          t.addEventListener('click',()=>{ t.classList.toggle('on'); params[f.key]=t.classList.contains('on'); update(true); });
        } else if(f.type==='color'){
          const palette=['#161616','#1f5e5a','#1b3a6b','#5a4a1f'];
          wrap.innerHTML=`<label>${f.label}</label><div class="sw">`+
            palette.map(c=>`<button data-c="${c}" style="background:${c}"${c===params[f.key]?' class="on"':''}></button>`).join('')+`</div>`;
          host.appendChild(wrap);
          wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
            wrap.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
            params[f.key]=b.dataset.c; view.setBeltColor(b.dataset.c);
          }));
        }
      }
    }

    function renderBOM(bom,total){
      document.getElementById('tot').textContent=total+' piezas';
      const body=document.getElementById('bbody'); body.innerHTML='';
      const cats={},order=[];
      bom.forEach(r=>{ if(!cats[r.category]){cats[r.category]=[];order.push(r.category);} cats[r.category].push(r); });
      order.forEach(cat=>{
        const h=document.createElement('div'); h.className='cat'; h.textContent=cat; body.appendChild(h);
        cats[cat].forEach(r=>{ const d=document.createElement('div'); d.className='brow';
          const tag=r.source==='derived'?' <span class="src">·der</span>':'';
          d.innerHTML=`<div class="c">${r.code}${tag}</div><div class="q">x${r.qty}</div><div class="d">${r.desc}</div>`;
          body.appendChild(d); });
      });
    }
    function renderInfo(res){
      document.getElementById('code').textContent=res.code;
      const m=res.plan.meta, e=m.envelope_mm; let s='';
      if(m.lanes!=null) s+=`bandas <b>${m.lanes}</b> · paso <b>${m.pitch_mm}</b> mm · `;
      if(m.rollers!=null) s+=`rodillos <b>${m.rollers}</b> · <b>${m.angle}°</b> · R <b>${m.radius_mm[0]}–${m.radius_mm[1]}</b> · `;
      s+=`envelope <b>${e.join(' × ')}</b> mm`;
      document.getElementById('stats').innerHTML=s;
    }

    function update(rebuild){
      const res=configure(model.schema.id, params); last=res;
      if(rebuild){ if(timer)clearTimeout(timer); timer=setTimeout(()=>view.setPlan(res.plan), 40); }
      renderBOM(res.bom, res.total_parts); renderInfo(res);
    }

    function loadModel(id){
      model=getModel(id); params={...model.defaults()};
      document.getElementById('mname').innerHTML=model.schema.name.split('·')[0];
      if(params.belt_color) view.setBeltColor(params.belt_color);
      buildFields();
      view.setPlan(configure(id, params).plan);
      update(false);
    }

    loadModel(listModels()[0].id);

    // --- controles de vista ---
    function vtoggle(id, fn){ const el=document.getElementById(id);
      el.addEventListener('click', ()=>{ el.classList.toggle('on'); fn(el.classList.contains('on')); }); }
    vtoggle('v_bolts', (on)=>view.setShowBolts(on));
    vtoggle('v_rot',   (on)=>view.setAutoRotate(on));
    vtoggle('v_anim',  (on)=>view.setAnim(on));

    // --- ocultar / mostrar controles (botón flotante siempre visible + tecla H) ---
    const uitoggle=document.getElementById('uitoggle');
    function setClean(on){ document.body.classList.toggle('clean', on); uitoggle.textContent = on ? 'Mostrar panel' : 'Ocultar panel'; }
    uitoggle.addEventListener('click', ()=> setClean(!document.body.classList.contains('clean')));
    window.addEventListener('keydown', (e)=>{ if((e.key==='h'||e.key==='H') && !/input|textarea/i.test(e.target.tagName)) setClean(!document.body.classList.contains('clean')); });

    // --- exportar STEP real vía backend CadQuery (?api=URL) ---
    const btn=document.getElementById('export'), emsg=document.getElementById('exportmsg');
    if(!API){ emsg.innerHTML='Para STEP/GLB reales abre con <b>?api=URL</b> del backend.'; }
    btn.addEventListener('click',()=>{
      if(!API){ emsg.innerHTML='Configura el backend: <b>'+location.pathname+'?api=https://tu-host</b>'; return; }
      btn.disabled=true; emsg.textContent='Generando B-Rep en el backend (CadQuery)…';
      fetch(API+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:model.schema.id, params:model.backendParams(params)})})
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(d=>{ const dl=d.downloads;
          const back=(d.total_parts!=null && last && d.total_parts!==last.total_parts)
            ? `<br><span style="color:#ff7a7a">⚠ backend ${d.total_parts} vs sim ${last.total_parts}</span>` : '';
          emsg.innerHTML=`<b style="color:var(--accent2)">${d.code}</b> · ${d.total_parts} piezas<br>`+
            `<a style="color:var(--accent)" href="${API+dl.step}">STEP</a> · `+
            `<a style="color:var(--accent)" href="${API+dl.glb}">GLB</a>`+
            (dl.bom_csv?` · <a style="color:var(--accent)" href="${API+dl.bom_csv}">BOM csv</a>`:'')+back; })
        .catch(e=>{ emsg.innerHTML='<span style="color:#ff7a7a">Error: '+e.message+'</span>'; })
        .finally(()=>{ btn.disabled=false; });
    });
  }catch(err){ showErr((err&&err.stack)?err.stack:String(err)); }
</script>
</body></html>
